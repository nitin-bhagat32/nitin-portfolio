<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitin | Resume</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        nav {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
        }

        .nav-link {
            position: relative;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #60a5fa;
        }

        .nav-link.active {
            color: #3b82f6;
        }

        .glass {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        input,
        textarea {
            background: #161616;
            border: 1px solid #333;
            color: white;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 px-6 md:px-20 py-5">
        <div class="flex justify-between items-center">

            <!-- LOGO -->
            <div class="text-3xl font-bold">
                <span class="text-blue-500">&lt;</span>
                Nitin
                <span class="text-blue-500">/&gt;</span>
            </div>

            <!-- LINKS -->
            <div class="flex gap-6 text-gray-300 font-medium">
                <a href="index.html" class="nav-link hover:text-blue-400">Home</a>
                <a href="projects.html" class="nav-link hover:text-blue-400">Projects</a>
                <a href="resume.html" class="nav-link active">Resume</a>
            </div>

        </div>
    </nav>

    <!-- HERO -->
    <section class="min-h-screen flex items-center justify-center px-6 py-16">

        <div class="glass max-w-4xl w-full rounded-3xl p-10 md:p-16 shadow-2xl">

            <!-- ICON -->
            <div class="text-center">

                <div
                    class="w-24 h-24 mx-auto rounded-full bg-blue-600/20 flex items-center justify-center text-4xl text-blue-500 mb-6">

                    <i class="fas fa-file-alt"></i>

                </div>

                <!-- TITLE -->
                <h1 class="text-4xl md:text-5xl font-bold mb-5">
                    Resume Access
                </h1>

                <!-- SUBTITLE -->
                <p class="text-gray-400 text-lg leading-relaxed max-w-2xl mx-auto">

                    Please enter your professional details below.
                    A pre-written email request will open automatically.

                </p>

            </div>

            <!-- FORM -->
            <div class="max-w-2xl mx-auto mt-12 space-y-6">

                <!-- Recruiter Name -->
                <div>
                    <label class="block mb-2 text-gray-300">
                        Recruiter Name
                    </label>

                    <input
                        type="text"
                        id="recruiterName"
                        placeholder="John Smith"
                        class="w-full p-4 rounded-xl">
                </div>

                <!-- Company -->
                <div>
                    <label class="block mb-2 text-gray-300">
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="companyName"
                        placeholder="Google, Amazon, Deloitte..."
                        class="w-full p-4 rounded-xl">
                </div>

                <!-- Recruiter Email -->
                <div>
                    <label class="block mb-2 text-gray-300">
                        Official Work Email
                    </label>

                    <input
                        type="email"
                        id="recruiterEmail"
                        placeholder="john@company.com"
                        class="w-full p-4 rounded-xl">
                </div>

                <!-- BUTTON -->
                <div class="text-center pt-4">

                    <button
                        onclick="sendMail()"
                        class="btn-glow bg-blue-600 hover:bg-blue-700 transition duration-300 px-10 py-4 rounded-2xl text-lg font-semibold">

                        <i class="fas fa-paper-plane mr-2"></i>
                        Request Resume

                    </button>

                </div>

            </div>

            <!-- EXTRA -->
            <div class="mt-14 text-center">

                <p class="text-gray-500 text-sm">
                    Genuine requests usually receive a response within 24 hours.
                </p>

            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="border-t border-gray-800 py-6 text-center text-gray-500 text-sm">

        © 2025 Nitin Bhagat. All rights reserved.

    </footer>

    <!-- SCRIPT -->
    <script>

        function sendMail() {

            const recruiterName = document.getElementById("recruiterName").value;
            const companyName = document.getElementById("companyName").value;
            const recruiterEmail = document.getElementById("recruiterEmail").value;

            const subject = "Request for Resume – Data Analyst Opportunity";

            const body =
`Hi Nitin,

I came across your portfolio and would like to request your resume for a potential opportunity.

Recruiter Name: ${recruiterName}
Company: ${companyName}
Official Email: ${recruiterEmail}

Please share your latest resume when convenient.

Best regards,
${recruiterName}
${companyName}`;

            window.location.href =
                `mailto:ntnkmr6969@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

        }

    </script>
</body>
</html>
