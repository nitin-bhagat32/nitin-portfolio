    <!-- SCRIPT -->
    <script>

        async function requestResume() {

            // Ask visitor email
            const visitorEmail = prompt("Please enter your email to request the resume:");

            if (!visitorEmail) {
                return;
            }

            // Send email notification to you
            fetch("https://formsubmit.co/ajax/ntnkmr6969@gmail.com", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    name: "Resume Request",
                    email: visitorEmail,
                    message:
                        `Someone requested your resume.\n\nVisitor Email: ${visitorEmail}\n\nApprove manually by sending your resume personally.`
                })
            })
                .then(response => response.json())
                .then(data => {

                    document.getElementById("statusMessage").classList.remove("hidden");

                    alert(
                        "Your request has been sent successfully.\n\nNitin will review and approve your request manually."
                    );

                })
                .catch(error => {

                    alert("Something went wrong. Please try again.");

                });

        }

    </script>
